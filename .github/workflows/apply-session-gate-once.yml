name: Apply Session Gate Once

on:
  push:
    branches:
      - feature/cme-calendar-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore: stage one-time session gate patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cme-calendar-gate
      - name: Patch execution gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trading_core/simple_paper_position_execution.py')
          text = path.read_text()

          replacements = [
              (
                  '    position_id: str,\n    point_value: float,\n) -> dict[str, Any]:\n    """Execute at most one accepted OPEN action from FLAT."""',
                  '    position_id: str,\n    point_value: float,\n    allow_new_risk: bool = True,\n) -> dict[str, Any]:\n    """Execute at most one accepted OPEN action from FLAT."""',
              ),
              (
                  '    if current_position.get("status") != "FLAT":\n        raise ValueError("FLAT execution requires FLAT current position")\n    if accepted_plan is None or accepted_plan.get("decision") != "OPEN" or market is None:',
                  '    if current_position.get("status") != "FLAT":\n        raise ValueError("FLAT execution requires FLAT current position")\n    if not allow_new_risk:\n        return _no_action(current_position, account)\n    if accepted_plan is None or accepted_plan.get("decision") != "OPEN" or market is None:',
              ),
              (
                  '    point_value: float,\n    stale_after_minutes: int = 15,\n) -> dict[str, Any]:\n    """Advance one durable OPEN position by at most one fill action.',
                  '    point_value: float,\n    stale_after_minutes: int = 15,\n    allow_new_risk: bool = True,\n) -> dict[str, Any]:\n    """Advance one durable OPEN position by at most one fill action.',
              ),
              (
                  '    if accepted_plan is not None and accepted_plan.get("decision") == "UPDATE":\n        position = apply_open_plan_update(position, accepted_plan, executed_at)\n        changed_without_execution = True\n\n    bar = _latest_bar(market) if market is not None else None',
                  '    if accepted_plan is not None and accepted_plan.get("decision") == "UPDATE":\n        plan_to_apply = accepted_plan\n        if not allow_new_risk and accepted_plan.get("add_once") is not None:\n            plan_to_apply = deepcopy(accepted_plan)\n            plan_to_apply["add_once"] = None\n        position = apply_open_plan_update(position, plan_to_apply, executed_at)\n        changed_without_execution = True\n\n    if not allow_new_risk and position.get("pending_add") is not None:\n        position["pending_add"] = None\n        position["position_version"] = int(position["position_version"]) + 1\n        position["updated_at"] = _iso_z(executed_at)\n        position["last_action_id"] = f"risk-gate:{_iso_z(executed_at)}"\n        changed_without_execution = True\n\n    bar = _latest_bar(market) if market is not None else None',
              ),
              (
                  '    add_order = position.get("pending_add")\n    if add_order is not None:',
                  '    add_order = position.get("pending_add")\n    if allow_new_risk and add_order is not None:',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/apply-session-gate-once.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/trading_core/simple_paper_position_execution.py .github/workflows/apply-session-gate-once.yml
          git commit -m "fix: block Simple Paper new risk outside trading session"
          git push origin HEAD:feature/cme-calendar-gate
